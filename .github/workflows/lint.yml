name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint

      - name: Ruff check
        run: |
          ruff check custom_components/ir_fan_control
          ruff format --check custom_components/ir_fan_control

      - name: Pylint (errors only)
        run: |
          pylint --errors-only --disable=import-error custom_components/ir_fan_control
